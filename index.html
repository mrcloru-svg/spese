<style>
  :root{
    --navy:#1E2761; --gold:#C9A227; --goldsoft:#F4E9C8; --ice:#CADCFC;
    --ink:#22273A; --mute:#5A6478; --panel:#F3F6FC; --line:#D9E2F2;
    --paper:#F7F8FC; --green:#1E7A46; --greensoft:#E3F2E9; --red:#B23A3A; --redsoft:#FBEAEA;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);
       font-size:16px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom)}
  .num{font-variant-numeric:tabular-nums}
  header{background:var(--navy);padding:calc(14px + env(safe-area-inset-top)) 16px 12px}
  header .wrap{max-width:720px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
  .eyebrow{color:var(--gold);font-size:11px;font-weight:700;letter-spacing:2px}

  nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);

  nav .wrap{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
  nav button{background:none;border:0;padding:9px 0 7px;color:var(--mute);font-size:11px;font-weight:500;

  section.flat{background:var(--panel)}

<main id="schermo"></main>

<script>
/* =========================================================================
   Spese 3.0 — applicazione
   Scrive nella coda su Drive attraverso il ponte Apps Script; legge da lì il
   riepilogo pubblicato dall'agente che gira sul PC.
   ========================================================================= */

/* Indirizzo del ponte e chiave NON stanno nel codice: si inseriscono al primo
   avvio su ogni dispositivo e restano salvati solo lì. Così l'app può essere
   pubblicata su un indirizzo web pubblico senza esporre nulla. */
const CFG_PREDEFINITA = {
  ponte: "",
  token: "",
  pagamenti: ["Visa","Addebito banca","Ticket Restaurant","Contanti","Bancomat","Bonifico","Mastercard"]
};

const K = { cfg:"spese3-cfg", coda:"spese3-coda", storico:"spese3-storico", riep:"spese3-riepilogo",
            abit:"spese3-abitudini", tax:"spese3-tassonomia",
            prat:"spese3-pratiche", cmd:"spese3-comandi" };
const MESI = ["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];

/* ---------- memoria locale ---------- */
const leggi = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } };
const scrivi = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } };

let CFG = Object.assign({}, CFG_PREDEFINITA, leggi(K.cfg, {}));
let coda = leggi(K.coda, []);        // spese non ancora accettate dal ponte
let storico = leggi(K.storico, []);  // spese inviate, tenute per memoria locale
let riepilogo = leggi(K.riep, null);
let tassonomia = leggi(K.tax, null);
let pratiche = leggi(K.prat, null);
let comandi = leggi(K.cmd, []);     // istruzioni in attesa di partire per l'agente
let statoAgente = null;
let scheda = "nuova";

/* ---------- formato numeri all'italiana ---------- */
const raggruppa = (s) => { const m = s.match(/(\d{4,})/); if(!m) return s;
  return s.replace(m[1], m[1].replace(/\B(?=(\d{3})+(?!\d))/g, ".")); };
const euro = (v) => raggruppa(new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR",
  minimumFractionDigits:2,maximumFractionDigits:2}).format(v||0));
const nIt = (v,d=2) => raggruppa(new Intl.NumberFormat("it-IT",{minimumFractionDigits:d,maximumFractionDigits:d}).format(v||0));
const oggiISO = () => { const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const itData = (iso) => { const [a,m,g]=iso.split("-"); return g+"/"+m+"/"+a; };
const importoDaTesto = (s) => { if(typeof s==="number") return s;
  // L'ultimo separatore vale come decimale se seguito da una o due cifre ("133.50",
  // "133,50"); altrimenti punti e virgole sono separatori di migliaia ("1.234").
  let t = String(s).trim().replace(/[^\d.,]/g,"");
  if (!t) return null;
  const m = t.match(/[.,](\d{1,2})$/);
  if (m) t = t.slice(0, t.length-m[0].length).replace(/[.,]/g,"") + "." + m[1];
  else   t = t.replace(/[.,]/g,"");
  const n = parseFloat(t); return isNaN(n)?null:Math.round(n*100)/100; };

/* ---------- tassonomia: categorie, sottocategorie e legami ammessi ----------
   Quando la tassonomia c'è, è lei a comandare: i menu propongono solo le
   combinazioni ammesse. Se manca — primo avvio, ponte irraggiungibile — si
   ricade sulle coppie realmente presenti nei dati, come prima. */
const taxOk = () => !!(tassonomia && tassonomia.categorie && tassonomia.legami);
const taxNomeCat = (id) => { const c = (tassonomia.categorie||[]).find(x=>x.id===id); return c?c.nome:null; };
const taxNomeSub = (id) => { const s = (tassonomia.sottocategorie||[]).find(x=>x.id===id); return s?s.nome:null; };
const taxCat = (nome) => (tassonomia.categorie||[]).find(x=>x.nome===nome);
const taxSub = (nome) => (tassonomia.sottocategorie||[]).find(x=>x.nome===nome);

function categorieDaTassonomia(){
  const out = {};
  (tassonomia.categorie||[]).filter(c=>c.attiva).forEach(c => { out[c.nome] = []; });
  (tassonomia.legami||[]).forEach(l => {
    if (!l.attivo) return;
    const c = taxNomeCat(l.cat), s = taxNomeSub(l.sub);
    if (c && s && out[c]) out[c].push(s);
  });
  Object.keys(out).forEach(c => out[c].sort((a,b)=>a.localeCompare(b,"it")));
  const ord = {};
  Object.keys(out).sort((a,b)=>a.localeCompare(b,"it")).forEach(c => ord[c] = out[c]);
  return ord;
}

function categorie(){
  if (taxOk()) return categorieDaTassonomia();
  const m = {};
  (riepilogo && riepilogo.voci || []).forEach(v => { (m[v.cat] = m[v.cat] || new Set()).add(v.sub); });
  [...coda, ...storico].forEach(v => { (m[v.categoria] = m[v.categoria] || new Set()).add(v.sottocategoria); });
  const out = {};
  Object.keys(m).sort((a,b)=>a.localeCompare(b,"it")).forEach(c => {
    out[c] = [...m[c]].filter(x=>x && x!=="—").sort((a,b)=>a.localeCompare(b,"it"));
  });
  return out;
}

/* ---------- abitudini di pagamento ---------- */
function abitudini(){
  const h = {};
  const conta = (cat,sub,met,peso) => { if(!met) return;
    const k = cat+"|"+sub; (h[k] = h[k] || {}); h[k][met] = (h[k][met]||0)+peso;
    const k2 = cat+"|*"; (h[k2] = h[k2] || {}); h[k2][met] = (h[k2][met]||0)+peso; };
  (riepilogo && riepilogo.dettaglio || []).forEach(v => conta(v.cat, v.sub, v.metodo, 1));
  [...storico, ...coda].forEach(v => conta(v.categoria, v.sottocategoria, v.pagamento, 3));
  return h;
}
function pagamentoAbituale(cat, sub){
  const h = abitudini();
  for (const k of [cat+"|"+sub, cat+"|*"]) {
    const m = h[k]; if(!m) continue;
    const best = Object.entries(m).sort((a,b)=>b[1]-a[1])[0];
    if (best) { const tot = Object.values(m).reduce((s,x)=>s+x,0);
      return { metodo: best[0], quota: best[1]/tot }; }
  }
  return null;
}

/* ---------- concetti di spesa (generici, nessun dato personale) ----------
   A sinistra le parole che una persona può pronunciare; a destra i frammenti
   da cercare nei NOMI delle sottocategorie di chi usa l'app, quali che siano. */
const CONCETTI = [
  [/benzina|gasolio|carburante|rifornimento|distributore|diesel/, ["carburant","benzina"]],
  [/ricarica elettric|colonnina/,                                  ["elettric"]],
  [/supermercat|\bspesa\b|discount|alimentari|drogheria/,          ["spesa","cibo","aliment"]],
  [/pranzo|cena|ristorante|pizzeria|trattoria|\bbar\b|colazione|caff|aperitivo|sushi/, ["mangiare","ristor","fuori"]],
  [/farmaci|medicin|dottore|visita|dentista|analisi|fisioterap|ticket sanitario/, ["medico","salute","farmac"]],
  [/autostrada|pedaggio|telepass|parcheggi|\bpark\b/,              ["autostrad","parcheggi","pedagg"]],
  [/\bluce\b|energia elettrica|elettricit|bolletta luce/,          ["elettricit","luce"]],
  [/\bgas\b|metano|bombola|\bgpl\b/,                               ["gas","metano"]],
  [/\bacqua\b/,                                                    ["acqua"]],
  [/netflix|telefon|cellulare|internet|fibra|spotify|abbonament|\bsim\b/, ["tel ","telefon","internet","abbonament","netflix"]],
  [/regal/,                                                        ["regal"]],
  [/assicurazion|\bbollo\b|rc auto/,                               ["assicuraz","bollo"]],
  [/meccanico|tagliando|gomme|riparazion|manutenzion/,             ["riparazion","manutenzion","gomme"]],
  [/condominio|affitto|mutuo|rata casa/,                           ["condominio","affitto","mutuo"]],
  [/pulizi|stirat|\bcolf\b/,                                       ["pulizia","stirat"]],
  [/vestit|abbigliament|scarpe|shopping/,                          ["shopping","abbigliament"]],
  [/parrucchier|barbiere|estetist/,                                ["cura personale","parrucchier"]],
  [/\bvolo\b|aereo|hotel|albergo|vacanz|viaggio|treno|nave|traghetto/, ["viagg","vacanz","nave","aereo","volo"]],
  [/commission|canone carta|spese banca|bollo conto/,              ["banca","finanziari","commission"]],
  [/\bimu\b|\btari\b|rifiuti|tassa|tasse/,                         ["tasse","rifiuti","imu"]],
  [/scuola|università|libri scolastici|retta/,                     ["scuola","istruzion"]],
];

/* Cerca la coppia categoria/sottocategoria più adatta alla frase, usando solo
   le voci realmente presenti nei dati dell'utente. */
function trovaVoce(testo, cats){
  const t = " " + testo.toLowerCase() + " ";
  let frammenti = null;
  for (const [re, fr] of CONCETTI) if (re.test(t)) { frammenti = fr; break; }
  if (!frammenti) return null;

  // tutte le coppie le cui sottocategorie contengono uno dei frammenti
  const candidate = [];
  Object.keys(cats).forEach(c => cats[c].forEach(s => {
    const sl = s.toLowerCase();
    if (frammenti.some(f => sl.includes(f))) candidate.push({ cat:c, sub:s });
  }));
  if (!candidate.length) return null;
  if (candidate.length === 1) return candidate[0];

  // più categorie hanno quella sottocategoria: decide chi è nominato nella frase
  // (il nome della categoria stessa: un luogo, una persona, una casa…)
  const parole = t.split(/[^a-zàèéìòù0-9]+/).filter(w => w.length > 3);
  const usi = frequenzaCoppie();
  const desc = descrizioniPerVoce();
  let migliore = null, punteggio = -1;
  candidate.forEach(k => {
    const chiave = k.cat + "|" + k.sub;
    let p = 0;
    // 1) la frase nomina la categoria stessa (un luogo, una persona, una casa)
    const cl = k.cat.toLowerCase();
    parole.forEach(w => { if (cl.includes(w)) p += 100 + w.length; });
    // 2) la frase usa parole già comparse nelle descrizioni di quella voce:
    //    così nomi di paesi, negozi o persone si imparano dai dati, non dal codice
    const testi = desc[chiave] || "";
    parole.forEach(w => { if (testi.includes(w)) p += 30 + w.length; });
    // 3) a parità, vince la voce che usi più spesso
    p += Math.min(20, usi[chiave] || 0);
    if (p > punteggio) { punteggio = p; migliore = k; }
  });
  return migliore;
}

/* Tutte le descrizioni già usate, raccolte per coppia categoria|sottocategoria. */
let cacheDescrizioni = null;
function descrizioniPerVoce(){
  if (cacheDescrizioni) return cacheDescrizioni;
  const d = {};
  (riepilogo && riepilogo.dettaglio || []).forEach(v => {
    if (!v.desc) return;
    const k = v.cat + "|" + v.sub;
    d[k] = (d[k] || "") + " " + v.desc.toLowerCase();
  });
  [...storico, ...coda].forEach(v => {
    if (!v.descrizione) return;
    const k = v.categoria + "|" + v.sottocategoria;
    d[k] = (d[k] || "") + " " + v.descrizione.toLowerCase();
  });
  cacheDescrizioni = d;
  return d;
}

function frequenzaCoppie(){
  const c = {};
  (riepilogo && riepilogo.dettaglio || []).forEach(v => { const k=v.cat+"|"+v.sub; c[k]=(c[k]||0)+1; });
  [...storico, ...coda].forEach(v => { const k=v.categoria+"|"+v.sottocategoria; c[k]=(c[k]||0)+2; });
  return c;
}

/* Le entrate non si registrano più: dal 25/10/2026 sono uscite dal master e
   dalla tassonomia, e ogni spesa nuova è per definizione un'uscita. */

/* ---------- interprete locale della frase ---------- */
const UNITA  = {zero:0,uno:1,un:1,una:1,due:2,tre:3,quattro:4,cinque:5,sei:6,sette:7,otto:8,nove:9};
const DIECI  = {dieci:10,undici:11,dodici:12,tredici:13,quattordici:14,quindici:15,sedici:16,
                diciassette:17,diciotto:18,diciannove:19};
const DECINE = {venti:20,trenta:30,quaranta:40,cinquanta:50,sessanta:60,settanta:70,ottanta:80,novanta:90};
const senzaAccenti = (w) => w.replace(/[àá]/g,"a").replace(/[èé]/g,"e").replace(/[ìí]/g,"i")
                             .replace(/[òó]/g,"o").replace(/[ùú]/g,"u");

/* Una parola sola, anche composta: "centotrentatre", "duemilacinquecento", "ventotto". */
function parolaNumero(w){
  w = senzaAccenti(w);
  if (!w) return null;
  if (w in UNITA)  return UNITA[w];
  if (w in DIECI)  return DIECI[w];
  if (w in DECINE) return DECINE[w];
  let i = w.indexOf("mila");
  if (i > 0) { const a = parolaNumero(w.slice(0,i)); if (a===null) return null;
               const b = w.slice(i+4); return a*1000 + (b ? (parolaNumero(b)||0) : 0); }
  if (w.startsWith("mille")) { const b = w.slice(5); return 1000 + (b ? (parolaNumero(b)||0) : 0); }
  i = w.indexOf("cento");
  if (i >= 0) { const a = i===0 ? 1 : parolaNumero(w.slice(0,i)); if (a===null) return null;
                const b = w.slice(i+5); return a*100 + (b ? (parolaNumero(b)||0) : 0); }
  for (const d in DECINE) {
    if (w.startsWith(d)) { const b = w.slice(d.length);
      if (!b) return DECINE[d];
      const u = parolaNumero(b); if (u!==null && u<10) return DECINE[d]+u; }
    const radice = d.slice(0,-1);                      // elisione: ventuno, trentotto
    if (w.startsWith(radice)) { const b = w.slice(radice.length);
      const u = parolaNumero(b); if (u===1 || u===8) return DECINE[d]+u; }
  }
  return null;
}

/* "centotrentatré e cinquanta" → [133,50] · "settantacinque zero uno" → [75,01]
   "centotrentatré euro cinquanta centesimi" → [133,50]
   "quarantacinque di cui venti con ticket" → [45, 20] */
function importiDaParole(testo){
  const SEP  = {e:1,ed:1,virgola:1,con:1,euro:1};              // legano euro e centesimi
  const CENT = {centesimi:1,centesimo:1,cent:1,cents:1};       // dichiarano i centesimi
  const p = senzaAccenti(testo.toLowerCase()).replace(/[^a-z ]/g," ").split(/\s+/).filter(Boolean);
  const gruppi = []; let corrente = null, separato = false;
  for (const w of p){
    const v = parolaNumero(w);
    if (v !== null) { if (!corrente) corrente = {cifre:[v], sep:separato, dopo:""}; else corrente.cifre.push(v); separato = false; }
    else { if (corrente) { corrente.dopo = w; gruppi.push(corrente); corrente = null; } separato = !!SEP[w]; }
  }
  if (corrente) gruppi.push(corrente);
  if (!gruppi.length) return null;

  const valore = (g) => {
    const c = g.cifre;
    if (c.length === 1) return c[0];
    const coda = [];                                   // cifre finali sotto il dieci = centesimi
    for (let i=c.length-1; i>0 && c[i]<10; i--) coda.unshift(c[i]);
    if (coda.length >= 2) return c[0] + parseInt(coda.join(""),10)/100;
    return c.reduce((a,b)=>a+b,0);
  };

  if (gruppi.length === 1 && CENT[gruppi[0].dopo])            // "cinquanta centesimi"
    return [Math.round(valore(gruppi[0]))/100];

  /* Importi DISTINTI, non un totale solo: serve per lo sdoppiamento del ticket,
     dove la frase ne contiene due ("quarantacinque di cui venti con ticket"). */
  const importi = [];
  let tot = valore(gruppi[0]);
  for (let i=1;i<gruppi.length;i++){
    const g = gruppi[i], v = valore(g);
    const sonoCentesimi = (CENT[g.dopo] || g.sep) && v < 100;
    if (sonoCentesimi)            tot = tot + v/100;        // "e cinquanta", "cinquanta centesimi"
    else if (g.sep && v < tot)    tot = tot + v;            // "mille e duecento"
    else { importi.push(tot); tot = v; }                    // importo nuovo, a sé stante
  }
  importi.push(tot);
  return importi.map(x => Math.round(x*100)/100);
}

/* L'importo singolo: il più grande fra quelli trovati. */
function numeroDaParole(testo){
  const v = importiDaParole(testo);
  return (v && v.length) ? Math.max.apply(null, v) : null;
}

/* L'importo di un pezzo di frase, in cifre o a parole. Le forme con euro e
   centesimi staccati vengono riconosciute per prime, altrimenti "56 e 44"
   verrebbe letto come due importi distinti invece che come 56,44. */
function importoDaFrase(s){
  let m = s.match(/\b(\d{1,6})\s*(?:€|euro)\s+(\d{1,2})\s*cent/)      // 56 euro 44 centesimi
       || s.match(/\b(\d{1,6})\s+(?:e|ed|virgola)\s+(\d{1,2})\b/)      // 56 e 44
       || s.match(/\b(\d{1,6})\s+(\d{2})\s*(?:€|euro)\b/);             // 56 44 euro
  if (m) return Math.round(parseFloat(m[1] + "." + String(m[2]).padStart(2,"0"))*100)/100;

  const cifre = s.match(/\d+[.,]\d{1,2}|\d+/g);
  if (cifre) {
    const v = cifre.map(importoDaTesto).filter(x => x !== null && x > 0);
    if (v.length) return Math.max.apply(null, v);
  }
  const p = importiDaParole(s).filter(x => x > 0);
  return p.length ? Math.max.apply(null, p) : null;
}
function interpreta(testo){
  const t = " " + testo.toLowerCase().trim() + " ";
  const r = { valore:null, data:oggiISO(), categoria:"", sottocategoria:"", pagamento:"",
              descrizione:testo.trim(), inout:"Out", quotaTicket:null };

  /* L'importo si legge PRIMA del "di cui": quello che viene dopo è la quota
     ticket. La quota non si riconosce dalla grandezza — in "56 e 44 di cui
     37,50 ticket" il secondo numero più grande è 44, che sono i centesimi —
     ma dalla posizione nella frase. */
  const haTicket = /ticket|buoni pasto|buono pasto/.test(t);
  const parti = t.split(/\bdi cui\b/);
  const parteTotale = parti[0];
  const parteQuota  = parti.length > 1 ? parti.slice(1).join(" ") : "";

  r.valore = importoDaFrase(parteTotale);
  if (r.valore === null) r.valore = importoDaFrase(t);

  if (haTicket && r.valore !== null) {
    let q = parteQuota ? importoDaFrase(parteQuota) : null;
    if (q === null) {
      // niente "di cui": si prende il numero accanto alla parola ticket
      const m = t.match(/(?:ticket|buoni pasto|buono pasto)\s*(?:restaurant)?\s*(?:€\s*)?(\d+(?:[.,]\d{1,2})?)/)
             || t.match(/(\d+(?:[.,]\d{1,2})?)\s*(?:€|euro)?\s+(?:col|con|in)\s+(?:il\s+|i\s+)?(?:ticket|buoni pasto|buono pasto)/);
      if (m) q = importoDaTesto(m[1]);
    }
    // una parte non può superare il totale: è il controllo che salva dagli scambi
    if (q !== null && q > 0 && q < r.valore) r.quotaTicket = q;
  }

  // data relativa
  const d = new Date();
  if (/\bieri\b/.test(t)) d.setDate(d.getDate()-1);
  else if (/altro ?ieri/.test(t)) d.setDate(d.getDate()-2);
  const gg = t.match(/\b(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?\b/);
  if (gg) { const a = gg[3] ? (gg[3].length===2 ? "20"+gg[3] : gg[3]) : d.getFullYear();
    r.data = a+"-"+String(+gg[2]).padStart(2,"0")+"-"+String(+gg[1]).padStart(2,"0"); }
  else r.data = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

  // mezzo di pagamento dichiarato
  const mappaPag = [[/\bvisa\b/,"Visa"],[/mastercard|master card/,"Mastercard"],[/bancomat/,"Bancomat"],
    [/contant/,"Contanti"],[/ticket|buoni pasto/,"Ticket Restaurant"],[/bonific/,"Bonifico"],
    [/addebito|rid\b|domicil/,"Addebito banca"]];
  for (const [re,nome] of mappaPag) if (re.test(t)) { r.pagamento = nome; break; }

  // Categoria e sottocategoria: nessun nome personale nel codice. Si parte da
  // concetti di spesa generici e si cercano fra le TUE voci, lette dal riepilogo.
  const cats = categorie();
  const coppia = trovaVoce(t, cats);
  if (coppia) { r.categoria = coppia.cat; r.sottocategoria = coppia.sub; }
  if (!r.categoria) {
    // somiglianza con le descrizioni già usate in passato
    const parole = t.split(/\s+/).filter(w => w.length>3);
    let best=null, punti=0;
    (riepilogo && riepilogo.dettaglio || []).forEach(v => {
      if (!v.desc) return;
      const dd = " "+v.desc.toLowerCase()+" ";
      let p = 0; parole.forEach(w => { if (dd.includes(w)) p += w.length; });
      if (p > punti) { punti = p; best = v; }
    });
    if (best && punti >= 5) { r.categoria = best.cat; r.sottocategoria = best.sub; }
  }
  if (r.categoria && !r.pagamento) {
    const ab = pagamentoAbituale(r.categoria, r.sottocategoria);
    if (ab && ab.quota >= 0.5) r.pagamento = ab.metodo;
  }
  // Nel pagamento misto il mezzo indicato riguarda la quota NON coperta dai ticket
  if (r.quotaTicket != null && r.pagamento === "Ticket Restaurant") {
    const ab = r.categoria ? pagamentoAbituale(r.categoria, r.sottocategoria) : null;
    r.pagamento = (ab && ab.metodo !== "Ticket Restaurant") ? ab.metodo : "Visa";
  }
  if (!r.pagamento) r.pagamento = CFG.pagamenti[0];
  return r;
}

/* ---------- dettatura vocale del browser ----------
   Funziona in Chrome su PC e Android. Su iPhone il riconoscimento non è
   disponibile: lì si usa il microfono della tastiera, che scrive nel campo. */
/* Da alzare a ogni modifica. Compare in alto nell'intestazione e in Altro >
   Dati: è il modo immediato per sapere se il dispositivo sta usando la versione
   nuova o una copia rimasta in cache. */
const VERSIONE = "3.2.0";
const VERSIONE_DATA = "25/10/2026";

const PAUSA_FINE = 2500;   // silenzio dopo cui si considera finita la frase
const DURATA_MAX = 45000;  // limite di sicurezza complessivo

let riconoscitore = null, inAscolto = false;
/* testoBase = quanto confermato nelle sessioni precedenti (il browser chiude e
   riapre il riconoscitore da solo); sessione = quanto detto in quella in corso,
   sempre RICOSTRUITO e mai sommato. Su Android Chrome rimanda a ogni evento la
   trascrizione intera dall'inizio: sommandola si otterrebbe una valanga. */
let testoBase = "", sessione = "";
let timerSilenzio = null, timerMax = null, chiusuraVoluta = false;

function vocaleDisponibile(){
  return typeof window !== "undefined" &&
         ("SpeechRecognition" in window || "webkitSpeechRecognition" in window);
}
function azzeraTimer(){ clearTimeout(timerSilenzio); clearTimeout(timerMax); timerSilenzio = timerMax = null; }

/* Fonde due pezzi di trascrizione riconoscendo la sovrapposizione. Serve perché
   i motori vocali non si comportano allo stesso modo: su PC mandano la frase che
   cresce, su Android rimandano spesso lo stesso pezzo già definitivo, e a ogni
   riavvio della sessione ripetono l'ultima parola. Concatenare produrrebbe
   "ristorante ristorante ristorante"; fondere no. */
function unisci(a, b){
  a = (a||"").trim(); b = (b||"").trim();
  if (!a) return b;
  if (!b) return a;
  const A = a.toLowerCase(), B = b.toLowerCase();
  if (B.startsWith(A)) return b;          // b contiene già tutto a
  if (A.endsWith(B))   return a;          // b è già in coda ad a
  if (A.includes(B))   return a;          // ripetizione interna
  for (let n = Math.min(A.length, B.length); n > 2; n--) {
    if (A.slice(A.length - n) === B.slice(0, n)) return a + b.slice(n);
  }
  return a + " " + b;
}
function fermaDettatura(){
  chiusuraVoluta = true; inAscolto = false; azzeraTimer();
  try { if (riconoscitore) riconoscitore.stop(); } catch(e){}
  riconoscitore = null;
}
function avviaDettatura(mentreParla, allaFine, suErrore){
  const R = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!R) return suErrore("Dettatura non disponibile in questo browser");
  try {
    testoBase = ""; sessione = ""; chiusuraVoluta = false; inAscolto = true;
    riconoscitore = new R();
    riconoscitore.lang = "it-IT";
    riconoscitore.continuous = true;      // non si chiude alla prima pausa
    riconoscitore.interimResults = true;

    const concludi = () => {
      chiusuraVoluta = true; azzeraTimer();
      try { riconoscitore.stop(); } catch(e){}
    };
    const rimandaChiusura = () => {
      clearTimeout(timerSilenzio);
      timerSilenzio = setTimeout(concludi, PAUSA_FINE);
    };

    riconoscitore.onresult = ev => {
      // Si riparte SEMPRE da capo sull'elenco dei risultati: quello che il
      // browser manda è già il testo completo della sessione, non un pezzo.
      let finali = "", provvisorio = "";
      for (let i = 0; i < ev.results.length; i++) {
        const t = ev.results[i][0].transcript;
        if (ev.results[i].isFinal) finali = unisci(finali, t); else provvisorio = unisci(provvisorio, t);
      }
      sessione = finali;
      mentreParla(unisci(unisci(testoBase, sessione), provvisorio));
      rimandaChiusura();   // il conto alla rovescia riparte a ogni parola
    };

    riconoscitore.onerror = ev => {
      if (ev.error === "no-speech" || ev.error === "aborted") return;  // si riprende da sé
      inAscolto = false; chiusuraVoluta = true; azzeraTimer();
      suErrore(ev.error === "not-allowed"
        ? "Microfono negato: consentilo dall'icona nella barra dell'indirizzo"
        : ev.error === "network" ? "Dettatura non raggiungibile: serve la rete"
        : "Dettatura non riuscita (" + ev.error + ")");
    };

    riconoscitore.onend = () => {
      // Il browser chiude la sessione anche da solo: se non è stata una
      // chiusura voluta, si riparte senza perdere quanto già detto.
      if (!chiusuraVoluta && inAscolto) {
        testoBase = unisci(testoBase, sessione);   // si mette al sicuro e si riparte puliti
        sessione = "";
        try { riconoscitore.start(); return; } catch(e){}
      }
      inAscolto = false; azzeraTimer(); allaFine(unisci(testoBase, sessione));
    };

    riconoscitore.start();
    rimandaChiusura();
    timerMax = setTimeout(concludi, DURATA_MAX);
  } catch(e) { inAscolto = false; suErrore("Dettatura non avviabile"); }
}

/* ---------- dialogo con il ponte ---------- */
async function chiamaPonte(azione, dati){
  const corpo = Object.assign({ token: CFG.token, azione: azione }, dati || {});
  const risposta = await fetch(CFG.ponte, {
    method: "POST", redirect: "follow",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(corpo)
  });
  if (!risposta.ok) throw new Error("il ponte ha risposto " + risposta.status);
  const testo = await risposta.text();
  try { return JSON.parse(testo); } catch(e) { throw new Error("risposta non leggibile dal ponte"); }
}

async function sincronizza(silenzioso){
  try {
    if (coda.length) {
      const esito = await chiamaPonte("aggiungi", { voci: coda.map(v => ({
        id:v.id, data:v.data, categoria:v.categoria, sottocategoria:v.sottocategoria,
        valore:v.valore, pagamento:v.pagamento, inout:v.inout, descrizione:v.descrizione,
        origine:v.origine
      })) });
      if (esito && esito.ok) {
        storico = [...coda.map(v => Object.assign({}, v, { inviata:true })), ...storico].slice(0, 400);
        coda = []; scrivi(K.coda, coda); scrivi(K.storico, storico);
        if (!silenzioso) avviso("Spese inviate: ora tocca all'agente");
      } else throw new Error((esito && esito.errore) || "rifiutata");
    }
    statoAgente = await chiamaPonte("stato");
    const r = await chiamaPonte("riepilogo");
    if (r && r.voci) { riepilogo = r; scrivi(K.riep, r); }
    if (comandi.length) {
      const e2 = await chiamaPonte("comando", { comandi: comandi });
      if (e2 && e2.ok) { comandi = []; scrivi(K.cmd, comandi); }
    }
    try {   // la tassonomia non è indispensabile: senza, si ricade sui dati
      const x = await chiamaPonte("tassonomia");
      if (x && x.categorie && x.legami) { tassonomia = x; scrivi(K.tax, x); }
    } catch(e) {}
    try {
      const pr = await chiamaPonte("pratiche");
      if (pr && pr.pratiche) { pratiche = pr; scrivi(K.prat, pr); }
    } catch(e) {}
    disegna();
    return true;
  } catch(e) {
    if (!silenzioso) avviso("Sincronizzazione non riuscita: " + e.message, true);
    disegna();
    return false;
  }
}

        const ab=pagamentoAbituale(f.cat,f.sub); if(ab) bozza.pagamento=ab.metodo; disegna(); };
      c.appendChild(b); });
    s.appendChild(c);
  }

  /* modulo */
  const f = document.createElement("section");
  const subs = cats[bozza.categoria] || [];
  f.innerHTML =
    '<div class="campo"><label>IMPORTO €</label>' +
    '<input id="valore" class="importo num" inputmode="decimal" placeholder="0,00" value="'+bozza.valore+'"></div>' +
    '<div class="riga"><div class="campo"><label>CATEGORIA</label><select id="cat">' +
      '<option value="">Scegli…</option>' +
      Object.keys(cats).map(c=>'<option'+(c===bozza.categoria?' selected':'')+'>'+c+'</option>').join("") +
    '</select></div>' +
    '<div class="campo"><label>SOTTOCATEGORIA</label><select id="sub"'+(subs.length?'':' disabled')+'>' +
      subs.map(x=>'<option'+(x===bozza.sottocategoria?' selected':'')+'>'+x+'</option>').join("") +
    '</select></div></div>' +
    '<div class="campo"><label>DATA</label><input type="date" id="data" value="'+bozza.data+'"></div>' +
    '<div class="campo"><label>PAGAMENTO'+(bozza.pagamento?'':' — obbligatorio')+'</label>' +
      '<div class="chips" id="pag">' + CFG.pagamenti.map(p =>
        '<button class="chip'+(p===bozza.pagamento?' on':'')+'" data-p="'+p+'">'+p+'</button>').join("") + '</div></div>' +
    '<div class="campo"><label>DESCRIZIONE</label>' +
      '<textarea id="desc" rows="2" placeholder="Cosa, dove, note">'+bozza.descrizione+'</textarea></div>' +
    '<div class="campo"><label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);text-transform:none">' +
      '<input type="checkbox" id="split" style="width:auto"'+(bozza.split?' checked':'')+'> Una parte pagata con Ticket Restaurant</label>' +
      (bozza.split ? '<input id="ticket" class="num" inputmode="decimal" placeholder="quota ticket" value="'+bozza.ticket+'" style="margin-top:7px">' : '') +
    '</div>' +
    '<div id="anteprima"></div>' +
    '<button class="b" id="salva">Salva spesa</button>';
  s.appendChild(f);

  /* comportamenti */
  const q = id => document.getElementById(id);
  const aggiorna = () => {
    bozza.valore = q("valore").value; bozza.data = q("data").value;
    bozza.descrizione = q("desc").value; if (q("ticket")) bozza.ticket = q("ticket").value;
  };
  q("valore").oninput = () => { bozza.valore = q("valore").value; mostraAnteprima(); };
  q("desc").oninput = () => { bozza.descrizione = q("desc").value; };
  q("data").onchange = () => { bozza.data = q("data").value; };
  q("cat").onchange = () => { aggiorna(); bozza.categoria = q("cat").value;
    bozza.sottocategoria = (cats[bozza.categoria]||[])[0] || "";
    const ab = pagamentoAbituale(bozza.categoria, bozza.sottocategoria); if (ab) bozza.pagamento = ab.metodo;
    disegna(); };
  q("sub").onchange = () => { aggiorna(); bozza.sottocategoria = q("sub").value;
    const ab = pagamentoAbituale(bozza.categoria, bozza.sottocategoria); if (ab) bozza.pagamento = ab.metodo; disegna(); };
  q("split").onchange = () => { aggiorna(); bozza.split = q("split").checked; disegna(); };
  if (q("ticket")) q("ticket").oninput = () => { bozza.ticket = q("ticket").value; mostraAnteprima(); };
  q("pag").querySelectorAll(".chip").forEach(b => b.onclick = () => { aggiorna(); bozza.pagamento = b.dataset.p; disegna(); });

  q("bannulla").onclick = () => { bozza = null; fermaDettatura(); disegna(); };

  if (q("bmic")) q("bmic").onclick = () => {
    const b = q("bmic");
    if (inAscolto) { fermaDettatura(); b.textContent = "🎤 Detta"; b.style.background = "var(--navy)"; return; }
    avviaDettatura(
      testo => { q("frase").value = testo; },                 // mentre parli
      testo => {                                              // quando hai finito
        b.textContent = "🎤 Detta"; b.style.background = "var(--navy)";
        if (testo && testo.trim()) { q("frase").value = testo.trim(); q("binterpreta").click(); }
      },
      messaggio => { b.textContent = "🎤 Detta"; b.style.background = "var(--navy)"; avviso(messaggio, true); }
    );
    b.textContent = "● Ascolto"; b.style.background = "var(--red)";
  };
  q("binterpreta").onclick = () => {
    const testo = q("frase").value.trim(); if (!testo) return;
    const r = interpreta(testo);
    bozza = { valore: r.valore!==null ? String(r.valore).replace(".",",") : "", categoria:r.categoria,
      sottocategoria:r.sottocategoria, data:r.data, pagamento:r.pagamento, descrizione:r.descrizione,
      inout:r.inout, split: r.quotaTicket!=null, ticket: r.quotaTicket!=null ? String(r.quotaTicket).replace(".",",") : "" };
    disegna();
    avviso(r.categoria ? "Proposta pronta: controlla e salva" : "Interpretato in parte: scegli la categoria");
  };

  function mostraAnteprima(){
    const a = document.getElementById("anteprima"); if (!a) return;
    const tot = importoDaTesto(bozza.valore), tk = importoDaTesto(bozza.ticket);
    if (bozza.split && tot!==null && tk!==null && tk>0 && tk<tot) {
      a.innerHTML = '<div class="avviso g"><b>Verranno salvate 2 righe</b><br>' +
        '1 · Ticket Restaurant ' + euro(tk) + '<br>2 · ' + (bozza.pagamento||"da scegliere") + ' ' +
        euro(Math.round((tot-tk)*100)/100) + '</div>';
    } else a.innerHTML = "";
  }
  mostraAnteprima();

  q("salva").onclick = () => {
    aggiorna();
    const v = importoDaTesto(bozza.valore);
    if (v===null || v<=0) return avviso("Inserisci un importo valido", true);
    if (!bozza.categoria || !bozza.sottocategoria) return avviso("Scegli categoria e sottocategoria", true);
    if (!bozza.pagamento) return avviso("Scegli il mezzo di pagamento", true);
    const base = { data:bozza.data, categoria:bozza.categoria, sottocategoria:bozza.sottocategoria,
                   inout:bozza.inout, descrizione:bozza.descrizione.trim() };
    const tk = importoDaTesto(bozza.ticket);
    if (bozza.split && tk!==null && tk>0 && tk<v) {
      salvaSpesa(Object.assign({}, base, { valore:tk, pagamento:"Ticket Restaurant" }));
      salvaSpesa(Object.assign({}, base, { valore:Math.round((v-tk)*100)/100,
        pagamento: bozza.pagamento==="Ticket Restaurant" ? "Visa" : bozza.pagamento }));
      avviso("Salvate 2 righe");
    } else {
      salvaSpesa(Object.assign({}, base, { valore:v, pagamento:bozza.pagamento }));
      avviso("Spesa salvata");
    }
    bozza = null; disegna();
    sincronizza(true);
  };
}

function frequenti(){
  const c = {};
  [...storico, ...coda].forEach(v => { const k=v.categoria+"|"+v.sottocategoria; c[k]=(c[k]||0)+3; });
  (riepilogo && riepilogo.dettaglio || []).forEach(v => { const k=v.cat+"|"+v.sub; c[k]=(c[k]||0)+1; });
  return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([k]) => {
    const [cat,sub] = k.split("|"); return { cat, sub, etichetta: sub==="Varie" ? cat+" varie" : sub };
  });
}

let vista = "mese", annoSel = new Date().getFullYear(), meseSel = new Date().getMonth()+1, apertaCat = null;
function schermoMese(s){
  if (!riepilogo) {
    s.innerHTML = '<div class="avviso g">Nessun dato ancora. Vai su <b>Altro</b> e premi <b>Sincronizza</b>.</div>';
    return;
  }
  const anni = [...new Set((riepilogo.voci||[]).map(v=>v.anno))].sort((a,b)=>b-a);
  if (!anni.includes(annoSel)) annoSel = anni[0];
  const meseYTD = annoSel === new Date().getFullYear() ? new Date().getMonth()+1 : 12;
  const dentro = (a,m) => a===annoSel && (vista==="mese" ? m===meseSel : vista==="ytd" ? m<=meseYTD : true);

  const act = {}, bdg = {};
  const somma = (dove,cat,sub,val) => { dove[cat]=dove[cat]||{tot:0,subs:{}};
    dove[cat].tot+=val; dove[cat].subs[sub]=(dove[cat].subs[sub]||0)+val; };
  (riepilogo.voci||[]).forEach(v => { if (v.inout!=="Out" || !dentro(v.anno,v.mese)) return;
    somma(v.tipo==="Bdg"?bdg:act, v.cat, v.sub, v.valore); });
  // le spese non ancora nel master si sommano al consuntivo
  coda.forEach(v => { if (v.inout!=="Out") return;
    const a=+v.data.slice(0,4), m=+v.data.slice(5,7); if(!dentro(a,m)) return;
    somma(act, v.categoria, v.sottocategoria, v.valore); });

  const righe = [...new Set([...Object.keys(act), ...Object.keys(bdg)])]
    .map(c => ({cat:c, act:(act[c]||{}).tot||0, bdg:(bdg[c]||{}).tot||0}))
    .sort((a,b)=>a.cat.localeCompare(b.cat,"it"));
  const tA = righe.reduce((x,r)=>x+r.act,0), tB = righe.reduce((x,r)=>x+r.bdg,0);
  const periodo = vista==="mese" ? MESI[meseSel-1]+" "+annoSel
    : vista==="ytd" ? "Gen–"+MESI[meseYTD-1].slice(0,3)+" "+annoSel : "Anno "+annoSel;

  /* selettori */
  const sel = document.createElement("div"); sel.style.marginBottom="12px";
  sel.innerHTML = '<div class="riga" style="margin-bottom:8px">' +
    '<select id="anno" style="flex:0 0 100px">'+anni.map(a=>'<option'+(a===annoSel?' selected':'')+'>'+a+'</option>').join("")+'</select>' +
    '<div class="seg">' + [["mese","Mese"],["ytd","YTD"],["anno","Anno"]].map(([k,t]) =>
      '<button data-v="'+k+'" class="'+(vista===k?"on":"")+'">'+t+'</button>').join("") + '</div></div>' +
    (vista==="mese" ? '<select id="mese">'+MESI.map((m,i)=>'<option value="'+(i+1)+'"'+(i+1===meseSel?' selected':'')+'>'+m+'</option>').join("")+'</select>' : '');
  s.appendChild(sel);
  sel.querySelectorAll(".seg button").forEach(b => b.onclick = () => { vista=b.dataset.v; apertaCat=null; disegna(); });
  sel.querySelector("#anno").onchange = e => { annoSel=+e.target.value; apertaCat=null; disegna(); };
  if (sel.querySelector("#mese")) sel.querySelector("#mese").onchange = e => { meseSel=+e.target.value; apertaCat=null; disegna(); };

  /* totale */
  const t = document.createElement("section"); t.className="dark";
  t.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:baseline">' +
    '<div><div class="eyebrow">'+periodo.toUpperCase()+'</div>' +
    '<div class="num" style="font-size:30px;font-weight:700;margin-top:2px">'+euro(tA)+'</div></div>' +
    (tB>0 ? '<div style="text-align:right"><div style="color:var(--ice);font-size:12px">budget '+euro(tB)+'</div>' +
      '<div class="num" style="font-weight:700;font-size:17px;color:'+(tA>tB?"#FF9B9B":"#8FE3B0")+'">' +
      (tA>tB?"+":"−")+euro(Math.abs(tB-tA))+'</div></div>' : '') + '</div>' +
    (tB>0 ? '<div class="barra" style="background:rgba(255,255,255,.18);margin-top:10px"><i style="width:' +
      Math.min(100,(tA/tB)*100)+'%;background:'+(tA>tB?"#FF9B9B":"#8FE3B0")+'"></i></div>' : '');
  s.appendChild(t);

  /* elenco */
  const e = document.createElement("section");
  if (!apertaCat) {
    e.innerHTML = '<h2>Actual vs Budget per categoria</h2>';
    if (!righe.length) e.innerHTML += '<div class="vuoto">Nessun dato nel periodo.</div>';
    righe.forEach(r => {
      const over = r.bdg>0 && r.act>r.bdg;
      const pct = r.bdg>0 ? Math.min(100,(r.act/r.bdg)*100) : 100;
      const d = document.createElement("div");
      d.style.cssText = "padding:9px 0;border-top:1px solid var(--panel);cursor:pointer";
      d.innerHTML = '<div class="tot"><span>'+r.cat+' ›</span><b class="num">'+euro(r.act) +
        (r.bdg>0?'<span style="font-weight:400;color:var(--mute)"> / '+euro(r.bdg)+'</span>':'')+'</b></div>' +
        '<div class="barra"><i style="width:'+Math.max(3,pct)+'%;background:'+(over?"var(--red)":r.bdg>0?"var(--green)":"var(--navy)")+'"></i></div>' +
        (r.bdg>0 ? '<div class="mini num" style="color:'+(over?"var(--red)":"var(--green)")+';margin-top:2px">' +
          (over ? "sforamento "+euro(r.act-r.bdg) : "residuo "+euro(r.bdg-r.act))+'</div>' : '');
      d.onclick = () => { apertaCat = r.cat; disegna(); };
      e.appendChild(d);
    });
  } else {
    e.innerHTML = '<h2>← '+apertaCat+'</h2>';
    e.querySelector("h2").style.cursor="pointer";
    e.querySelector("h2").onclick = () => { apertaCat=null; disegna(); };
    const sA = (act[apertaCat]||{subs:{}}).subs, sB = (bdg[apertaCat]||{subs:{}}).subs;
    const chiavi = [...new Set([...Object.keys(sA), ...Object.keys(sB)])]
      .map(k=>({sub:k, act:sA[k]||0, bdg:sB[k]||0})).sort((a,b)=>a.sub.localeCompare(b.sub,"it"));
    chiavi.forEach(r => {
      const over = r.bdg>0 && r.act>r.bdg;
      const d = document.createElement("div"); d.style.cssText="padding:9px 0;border-top:1px solid var(--panel)";
      d.innerHTML = '<div class="tot"><span>'+r.sub+'</span><b class="num">'+euro(r.act) +
        (r.bdg>0?'<span style="font-weight:400;color:var(--mute)"> / '+euro(r.bdg)+'</span>':'')+'</b></div>' +
        '<div class="barra"><i style="width:'+Math.max(3, r.bdg>0?Math.min(100,(r.act/r.bdg)*100):100) +
        '%;background:'+(over?"var(--red)":r.bdg>0?"var(--green)":"var(--navy)")+'"></i></div>';
      e.appendChild(d);
    });
  }
  s.appendChild(e);

  const n = document.createElement("div"); n.className="mini";
  n.textContent = "Dati dal master, aggiornati al " + (riepilogo.generatoIl||"").replace("T"," ").slice(0,16) +
    (coda.length ? ". Comprese le "+coda.length+" spese non ancora trasferite." : ".");
  s.appendChild(n);
}

/* ---------- ALTRO ---------- */
/* ---------- Gestione voci ----------
   Categorie, sottocategorie e legami ammessi. L'impostazione è per categoria e
   non a matrice: sette categorie per trenta sottocategorie farebbero una
   griglia illeggibile su un telefono.
   Niente cancellazioni, solo disattivazioni: una voce dismessa sparisce dai
   menu ma lo storico che la usa resta leggibile. */
let vociAperta = null, vociStoriche = false, vociModificata = false;

const ident = (nome, prefisso) => prefisso + nome.toLowerCase()
  .normalize("NFD").replace(/[̀-ͯ]/g,"")
  .replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"");

function taxLegame(catId, subId){
  return (tassonomia.legami||[]).find(l => l.cat===catId && l.sub===subId);
}
function taxCommuta(catId, subId){
  const l = taxLegame(catId, subId);
  if (l) l.attivo = !l.attivo;
  else tassonomia.legami.push({ cat:catId, sub:subId, attivo:true, uso:0, ultimo:0 });
  vociModificata = true;
}
function taxNuovaSotto(catId, nome){
  nome = (nome||"").trim();
  if (!nome) return "Scrivi un nome";
  let s = taxSub(nome);
  if (!s) {
    const id = ident(nome, "sub_");
    if ((tassonomia.sottocategorie||[]).some(x=>x.id===id)) return "Esiste già una voce con questo nome";
    s = { id:id, nome:nome, attiva:true, alias:[], uso:0 };
    tassonomia.sottocategorie.push(s);
  }
  const l = taxLegame(catId, s.id);
  if (l && l.attivo) return "Questo legame c'è già";
  if (l) l.attivo = true; else tassonomia.legami.push({ cat:catId, sub:s.id, attivo:true, uso:0, ultimo:0 });
  vociModificata = true;
  return null;
}
function taxNuovaCategoria(nome){
  nome = (nome||"").trim();
  if (!nome) return "Scrivi un nome";
  if (taxCat(nome)) return "Esiste già una categoria con questo nome";
  const id = ident(nome, "cat_");
  if ((tassonomia.categorie||[]).some(x=>x.id===id)) return "Esiste già una voce con questo nome";
  tassonomia.categorie.push({ id:id, nome:nome, attiva:true, alias:[], uso:0, luoghi:[] });
  // Varie è il raccoglitore di ogni categoria: si crea subito il legame
  const varie = taxSub("Varie");
  if (varie) tassonomia.legami.push({ cat:id, sub:varie.id, attivo:true, uso:0, ultimo:0 });
  vociAperta = nome; vociModificata = true;
  return null;
}

async function salvaTassonomia(){
  try {
    const e = await chiamaPonte("salva_tassonomia", { tassonomia: tassonomia });
    if (e && e.ok) {
      scrivi(K.tax, tassonomia); vociModificata = false;
      avviso("Tassonomia salvata: " + e.legami + " legami");
    } else throw new Error((e && e.errore) || "rifiutata");
  } catch(err) {
    avviso("Salvataggio non riuscito: " + err.message, true);
  }
  disegna();
}

/* ---------- Rimborsi medici ----------
   Il foglio "Richiesta Fasi&Generali" è il registro delle pratiche; il master
   porta il netto a tuo carico. Qui si seguono gli stati e si registrano i
   riscontri; la decurtazione nel master viene PROPOSTA e tu la confermi, perché
   le due righe non si possono agganciare da sole: le date non coincidono
   (fattura il 22/02, registrata il 28/02) e le descrizioni divergono. */
let rimbFiltro = "da fare", rimbAperta = null, rimbPasso = null;

const ORDINE_STATI = ["da richiedere","attesa FASI","da chiedere ad AON","attesa AON",
                      "chiusa con residuo","chiusa","non richiedibile"];
const DA_FARE = ["da richiedere","attesa FASI","da chiedere ad AON","attesa AON"];

const giorniDa = (iso) => iso ? Math.round((Date.now() - new Date(iso).getTime())/86400000) : null;

function nuovoComando(tipo, dati){
  comandi.push({ id: "c"+Date.now()+"-"+Math.random().toString(36).slice(2,7),
                 tipo: tipo, dati: dati, creatoIl: new Date().toISOString() });
  scrivi(K.cmd, comandi);
}

/* Righe del master che potrebbero corrispondere a questa pratica: stessa
   persona, sottocategoria Medico, importo capiente, data vicina. */
function candidateMaster(p, daTogliere){
  const d = (riepilogo && riepilogo.dettaglio) || [];
  const mese = p.data ? +p.data.slice(5,7) : 0, anno = p.data ? +p.data.slice(0,4) : 0;
  // Non si filtra per persona: capita che la pratica sia intestata a uno e la
  // spesa sia registrata sotto l'altro. L'indizio forte è un altro — nel master
  // quella riga deve valere quanto il residuo della pratica — e conta più della
  // persona e della data.
  const atteso = p.residuo;
  return d.filter(x => x.sub === "Medico" && x.riga && x.valore >= daTogliere - 0.005)
    .map(x => Object.assign({
      scarto: Math.abs(x.valore - atteso),
      distanza: Math.abs((x.anno - anno) * 12 + (x.mese - mese)),
      stessaPersona: x.cat === p.chi ? 1 : 0
    }, x))
    .filter(x => x.distanza <= 2)
    .sort((a,b) => (a.scarto - b.scarto) || (a.distanza - b.distanza)
                || (b.stessaPersona - a.stessaPersona))
    .slice(0, 6);
}

function schermoRimborsi(s){

  const tutte = pratiche.pratiche;

    '<div class="avviso '+(daFare.length?"g":"v")+'">' +
      (daFare.length ? daFare.length+' pratiche richiedono una mossa, per '+euro(inGioco)+' ancora recuperabili.'
                     : 'Nessuna pratica in sospeso.') + '</div>' +
    '<div class="chips" id="filtri" style="margin-top:10px">' +
      '<button class="chip'+(rimbFiltro==="da fare"?' on':'')+'" data-f="da fare">Da fare ('+daFare.length+')</button>' +
      ORDINE_STATI.filter(x=>perStato[x]).map(x =>
        '<button class="chip'+(rimbFiltro===x?' on':'')+'" data-f="'+x+'">'+x+' ('+perStato[x].length+')</button>'
      ).join("") + '</div>';

    rimbFiltro = b.dataset.f; rimbAperta = null; rimbPasso = null; disegna(); });

  /* elenco */

  for (let i = 0; i < quante; i++) {
    const p = elenco[i];
    const sez = document.createElement("section");

                 : p.stato === "attesa AON"  ? giorniDa(p.aonRichiesta) : null;
    const vecchia = atteso !== null && atteso > 60;
    let h = '<div data-apri="'+p.riga+'" style="cursor:pointer">' +
      '<div class="riga" style="align-items:baseline">' +
        '<b style="flex:1">'+p.cosa+'</b><div class="num">'+euro(p.valore)+'</div></div>' +
      '<div class="mini">'+p.chi+' · '+(p.data?itData(p.data):"—")+' · '+p.stato +
        (atteso!==null ? ' da <b'+(vecchia?' style="color:var(--red)"':'')+'>'+atteso+' giorni</b>' : '') +
        (p.residuo > 0.005 ? ' · residuo '+euro(p.residuo) : '') + '</div></div>';

    if (rimbAperta === p.riga) {
      h += '<table style="margin-top:9px">' +
        '<tr><td>Fattura</td><td class="r num">'+euro(p.valore)+'</td></tr>' +
        (p.fasiRichiesta ? '<tr><td>FASI richiesto</td><td class="r">'+itData(p.fasiRichiesta)+'</td></tr>' : '') +
        (p.fasiRiscontro ? '<tr><td>FASI ha dato</td><td class="r num">'+euro(p.fasiOttenuto||0)+' il '+itData(p.fasiRiscontro)+'</td></tr>' : '') +
        (p.aonRichiesta ? '<tr><td>AON richiesto</td><td class="r">'+itData(p.aonRichiesta)+'</td></tr>' : '') +
        (p.aonRiscontro ? '<tr><td>AON ha dato</td><td class="r num">'+euro(p.aonOttenuto||0)+' il '+itData(p.aonRiscontro)+'</td></tr>' : '') +
        '<tr><td><b>Residuo a tuo carico</b></td><td class="r num"><b>'+euro(p.residuo)+'</b></td></tr></table>' +
        (p.note ? '<div class="mini" style="margin-top:6px">Nota: '+p.note+'</div>' : '');

      if (rimbPasso && rimbPasso.riga === p.riga) {
        h += modulo(p, rimbPasso);
      } else {
        h += '<div class="riga" style="margin-top:10px;flex-wrap:wrap;gap:7px">';
        if (p.stato === "da richiedere")
          h += '<button class="b ghost" data-az="chiediFASI|'+p.riga+'">Richiesto a FASI</button>' +
               '<button class="b ghost" data-az="nonRich|'+p.riga+'">Non richiedibile</button>';
        if (p.stato === "attesa FASI")
          h += '<button class="b ghost" data-az="rispFASI|'+p.riga+'">FASI ha risposto</button>';
        if (p.stato === "da chiedere ad AON")
          h += '<button class="b ghost" data-az="chiediAON|'+p.riga+'">Richiesto ad AON</button>';
        if (p.stato === "attesa AON")
          h += '<button class="b ghost" data-az="rispAON|'+p.riga+'">AON ha risposto</button>';
        h += '</div>';
      }

  }
  if (elenco.length > quante) {

    s.appendChild(p);
  }

  const fondo = document.createElement("section");
  fondo.innerHTML =
    (comandi.length ? '<div class="avviso g">'+comandi.length+' modifiche pronte da inviare: ' +
      'premi Sincronizza in Impostazioni.</div>' : '') +
    '<button class="b ghost" id="bindietro">Torna a Impostazioni</button>';
  s.appendChild(fondo);

  /* comportamenti */
  s.querySelectorAll("[data-apri]").forEach(e => e.onclick = () => {
    const r = +e.dataset.apri;
    rimbAperta = (rimbAperta === r) ? null : r; rimbPasso = null; disegna(); });
  s.querySelectorAll("[data-az]").forEach(e => e.onclick = () => {
    const [az, riga] = e.dataset.az.split("|");
    const p = tutte.find(x => x.riga === +riga);
    if (az === "nonRich") {
      nuovoComando("pratica_aggiorna", { riga:p.riga, attesoValore:p.valore,
                                         campi:{ richiedibile:false } });
      p.stato = "non richiedibile";
      avviso("Segnata come non richiedibile"); disegna(); return;
    }
    rimbPasso = { riga:p.riga, az:az, data:oggiISO(), importo:"" };
    disegna();
  });
  s.querySelectorAll("[data-conferma]").forEach(e => e.onclick = () => confermaPasso(tutte));

function modulo(p, passo){
  const chiede = (passo.az === "chiediFASI" || passo.az === "chiediAON");
  const ente = (passo.az.indexOf("FASI") >= 0) ? "FASI" : "AON";
  const titolo = chiede ? "Richiesta inviata a " + ente : ente + " ha risposto";
  const suggerito = chiede ? p.residuo : "";
  let h = '<div style="margin-top:10px;border-top:1px solid var(--line);padding-top:10px">' +
    '<b>'+titolo+'</b>' +
    '<div class="riga" style="margin-top:8px">' +
      '<div class="campo"><label>DATA</label><input type="date" id="rb-data" value="'+passo.data+'"></div>' +
      '<div class="campo"><label>'+(chiede?"IMPORTO RICHIESTO":"IMPORTO OTTENUTO")+'</label>' +
        '<input id="rb-imp" class="num" inputmode="decimal" placeholder="'+
        (chiede?String(suggerito).replace(".",","):"0 se non hanno dato niente")+'" value="'+passo.importo+'"></div>' +
    '</div>';
  if (passo.decurta) {
    const c = passo.decurta;
    h += '<div class="avviso g" style="margin-top:4px">Ora vanno tolti <b>'+euro(c.importo)+
         '</b> dal master. Quale riga?</div>';
    if (!c.candidate.length) {
      h += '<div class="mini">Nessuna riga Medico abbastanza capiente nei mesi vicini. ' +
           'Falla a mano in Excel.</div>';
    } else {
      c.candidate.forEach(x => {
        const nuovo = Math.round((x.valore - c.importo)*100)/100;
        h += '<button class="b ghost" style="margin-top:6px;text-align:left" data-decurta="' +
             x.riga+'|'+x.valore+'|'+nuovo+'">' + itData(x.data)+' · '+euro(x.valore)+
             ' → <b>'+euro(nuovo)+'</b><br><span class="mini">'+(x.desc||"senza descrizione")+'</span></button>';
      });
    }
    h += '<button class="b ghost" style="margin-top:8px" data-annulla="1">Non decurtare ora</button>';
  } else {
    h += '<div class="riga" style="margin-top:8px">' +
         '<button class="b" data-conferma="1">Conferma</button>' +
         '<button class="b ghost" data-annulla="1">Annulla</button></div>';
  }
  return h + '</div>';
}

function confermaPasso(tutte){
  const p = tutte.find(x => x.riga === rimbPasso.riga);
  const chiede = (rimbPasso.az === "chiediFASI" || rimbPasso.az === "chiediAON");
  const fasi = rimbPasso.az.indexOf("FASI") >= 0;
  let imp = importoDaTesto(rimbPasso.importo);
  if (chiede && imp === null) imp = p.residuo;
  if (imp === null) { avviso("Scrivi l'importo, anche 0", true); return; }
  if (imp > p.valore + 0.005) { avviso("L'importo supera la fattura", true); return; }

  const campi = {};
  if (chiede) {
    campi[fasi ? "fasiRichiesta" : "aonRichiesta"] = rimbPasso.data;
    campi[fasi ? "fasiValore"    : "aonValore"]    = imp;
  } else {
    campi[fasi ? "fasiRiscontro" : "aonRiscontro"] = rimbPasso.data;
    campi[fasi ? "fasiOttenuto"  : "aonOttenuto"]  = imp;
  }
  nuovoComando("pratica_aggiorna", { riga:p.riga, attesoValore:p.valore, campi:campi });

  if (!chiede && imp > 0) {
    // un rimborso incassato va tolto dal master: si propongono le righe candidate
    rimbPasso.decurta = { importo: imp, candidate: candidateMaster(p, imp) };
    avviso("Pratica aggiornata. Ora scegli la riga da decurtare");
  } else {
    rimbPasso = null;
    avviso("Pratica aggiornata: parte alla prossima sincronizzazione");
  }
  disegna();
}

    '<div class="mini" style="margin-top:6px">Categorie, sottocategorie e combinazioni ammesse.</div>' +
    '<button class="b ghost" style="margin-top:10px" id="brimb">Rimborsi medici' +
      (pratiche && pratiche.pratiche
        ? ' ('+pratiche.pratiche.filter(p=>DA_FARE.indexOf(p.stato)>=0).length+' da fare)' : '') +
      '</button>' +
    '<div class="mini" style="margin-top:6px">Pratiche FASI e AON, con i giorni di attesa.</div>' +
    '<div class="riga" style="margin-top:10px">' +
    '<button class="b ghost" id="bback">Scarica copia</button>' +
    '<button class="b ghost" id="bsvuota" style="color:var(--red)">Svuota coda</button></div>';
  s.appendChild(d);
  document.getElementById("bvoci").onclick = () => { scheda = "voci"; disegna(); };
  document.getElementById("brimb").onclick = () => {
    scheda = "rimborsi"; rimbPasso = null; rimbAperta = null; disegna(); };
  document.getElementById("bback").onclick = () => {
    const blob = new Blob([JSON.stringify({coda, storico, cfg:CFG}, null, 1)], {type:"application/json"});
    const u = URL.createObjectURL(blob); const link = document.createElement("a");
    link.href = u; link.download = "spese3_copia_"+oggiISO()+".json"; link.click();
    setTimeout(()=>URL.revokeObjectURL(u), 3000);
  };
  let conferma = false;
  document.getElementById("bsvuota").onclick = (ev) => {
    if (!conferma) { conferma = true; ev.target.textContent = "Confermi?"; return; }
    coda = []; scrivi(K.coda, coda); disegna(); avviso("Coda svuotata");
  };

  /* configurazione */
  const c = document.createElement("section");
  c.innerHTML = '<h2>Configurazione</h2>' +
    '<div class="campo"><label>INDIRIZZO DEL PONTE</label><input id="cponte" value="'+CFG.ponte+'"></div>' +
    '<div class="campo"><label>CHIAVE</label><input id="ctoken" value="'+CFG.token+'"></div>' +
    '<div class="campo"><label>MEZZI DI PAGAMENTO (separati da virgola)</label>' +
      '<input id="cpag" value="'+CFG.pagamenti.join(", ")+'"></div>' +
    '<button class="b sec" id="csalva">Salva configurazione</button>';
  s.appendChild(c);
  document.getElementById("csalva").onclick = () => {
    CFG.ponte = document.getElementById("cponte").value.trim();
    CFG.token = document.getElementById("ctoken").value.trim();
    CFG.pagamenti = document.getElementById("cpag").value.split(",").map(x=>x.trim()).filter(Boolean);
    scrivi(K.cfg, CFG); avviso("Configurazione salvata"); disegna();
  };
}

/* ---------- avvio ---------- */
(function mostraVersione(){
  const e = document.getElementById("etichettaVersione");
  if (e) e.textContent = VERSIONE;
})();
disegna();
if (navigator.onLine) sincronizza(true);
window.addEventListener("online", () => sincronizza(true));
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
